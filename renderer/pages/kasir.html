<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Kasir - Kasir & Manajemen Usaha</title>
<link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="main">
      <div class="main-inner">
        <div id="header-container"></div>

        <div class="flex items-center gap-3 mb-4 flex-wrap">
          <div class="input-icon-wrap" style="flex:1; min-width:220px;">
            <span class="icon" data-icon="search" data-icon-size="16"></span>
            <input class="input" id="search-product" placeholder="Cari produk..." />
          </div>
          <div class="btn-pill-group" id="category-filter">
            <button class="btn-pill active" data-cat="semua">Semua</button>
            <button class="btn-pill" data-cat="beras">Beras</button>
            <button class="btn-pill" data-cat="telur">Telur</button>
            <button class="btn-pill" data-cat="gas">Gas</button>
          </div>
        </div>

        <div class="kasir-layout">
          <div class="product-panel">
            <div class="product-grid" id="product-grid"></div>
          </div>

          <div class="card cart-panel">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                <span data-icon="cart" data-icon-size="17"></span>
                <span class="font-bold">Keranjang</span>
              </div>
              <span class="badge badge-gray" id="cart-count">0 item</span>
            </div>

            <div class="cart-items" id="cart-items">
              <div class="cart-empty">
                <div class="big-icon" data-icon="cart" data-icon-size="30"></div>
                <div>Keranjang kosong</div>
              </div>
            </div>

            <div class="pay-summary">
              <div class="pay-row"><span class="text-muted">Subtotal</span><span id="sum-subtotal">Rp 0</span></div>
              <div class="pay-row items-center">
                <span class="text-muted">Diskon</span>
                <input class="input" id="input-discount" type="number" min="0" value="0" style="width:130px; text-align:right;" />
              </div>
              <div class="pay-row total"><span>Total</span><span id="sum-total" class="text-green">Rp 0</span></div>

              <div class="pay-methods" id="payment-methods">
                <button class="btn btn-secondary active" data-method="tunai">Tunai</button>
                <button class="btn btn-secondary" data-method="transfer">Transfer</button>
                <button class="btn btn-secondary" data-method="qris">QRIS</button>
              </div>

              <div class="pay-row items-center">
                <span class="text-muted">Status Pembayaran</span>
                <button class="btn btn-secondary btn-sm" id="btn-payment-status" type="button">Lunas</button>
              </div>
              <div class="form-group mt-2">
                <label>Uang Dibayar</label>
                <input class="input" id="input-paid" type="text" inputmode="numeric" placeholder="0" />
                <div class="flex gap-2 flex-wrap mt-2" id="quick-paid-amounts">
                  <button class="btn btn-secondary btn-sm" type="button" data-paid-amount="exact">Uang Pas</button>
                  <button class="btn btn-secondary btn-sm" type="button" data-paid-amount="10000">Rp10.000</button>
                  <button class="btn btn-secondary btn-sm" type="button" data-paid-amount="20000">Rp20.000</button>
                  <button class="btn btn-secondary btn-sm" type="button" data-paid-amount="50000">Rp50.000</button>
                  <button class="btn btn-secondary btn-sm" type="button" data-paid-amount="100000">Rp100.000</button>
                </div>
              </div>
              <div class="pay-row"><span class="text-muted">Kembalian</span><span id="sum-change" class="font-semibold">Rp 0</span></div>

              <button class="btn btn-primary btn-block mt-2" id="btn-checkout" style="padding:12px;">Selesaikan Transaksi</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../../node_modules/@zxing/browser/umd/zxing-browser.min.js"></script>
  <script src="../js/kasir.js"></script>
</body>
</html>
