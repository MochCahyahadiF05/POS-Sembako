<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Barang Masuk - Kasir & Manajemen Usaha</title>
<link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="main">
      <div class="main-inner">
        <div id="header-container"></div>

        <div class="card">
          <div class="flex justify-between items-center flex-wrap gap-3 mb-3">
            <div>
              <div class="section-title">Barang Masuk</div>
              <div class="section-sub">Pencatatan stok masuk dari supplier</div>
            </div>
            <button class="btn btn-primary" id="btn-add">+ Catat Barang Masuk</button>
          </div>
          <div class="mb-3"><input class="input table-search" id="table-search" placeholder="Cari produk, supplier, atau catatan..." /></div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Tanggal</th>
                  <th>Produk</th>
                  <th>Kategori</th>
                  <th>Jumlah</th>
                  <th>Harga Beli</th>
                  <th>Total</th>
                  <th>Supplier</th>
                  <th>Catatan</th><th></th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
          <div class="pagination" id="table-pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/stock-in.js"></script>
</body>
</html>
