<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Laporan - Kasir & Manajemen Usaha</title>
<link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="main">
      <div class="main-inner">
        <div id="header-container"></div>

        <div class="flex justify-between items-center flex-wrap gap-3 mb-3" id="report-tabs">
          <div class="btn-pill-group" id="type-filter">
            <button class="btn-pill active" data-type="sales">Laporan Penjualan</button>
            <button class="btn-pill" data-type="stock">Laporan Stok</button>
            <button class="btn-pill" data-type="finance">Laporan Keuangan</button>
            <button class="btn-pill" data-type="gas">Laporan Gas</button>
            <button class="btn-pill" data-type="stockIn">Barang Masuk</button>
            <button class="btn-pill" data-type="stockOut">Barang Keluar</button>
          </div>
        </div>

        <div class="flex justify-between items-center flex-wrap gap-3 mb-4">
          <div class="btn-pill-group" id="period-filter">
            <button class="btn-pill" data-period="today">Hari Ini</button>
            <button class="btn-pill" data-period="week">Minggu Ini</button>
            <button class="btn-pill active" data-period="month">Bulan Ini</button>
            <button class="btn-pill" data-period="year">Tahun Ini</button>
            <button class="btn-pill" data-period="custom">Custom</button>
          </div>
          <div class="flex gap-2 items-center flex-wrap" id="custom-range" style="display:none;">
            <input type="date" class="input" id="custom-from" style="width:150px;" />
            <span class="text-muted text-sm">s/d</span>
            <input type="date" class="input" id="custom-to" style="width:150px;" />
            <button class="btn btn-secondary btn-sm" id="btn-apply-custom">Terapkan</button>
          </div>
          <div class="flex gap-2 no-print">
            <button class="btn btn-outline" id="btn-print" data-icon="printer"><span>Cetak</span></button>
            <button class="btn btn-outline" id="btn-export-pdf" data-icon="fileText"><span>Export PDF</span></button>
            <button class="btn btn-outline" id="btn-export-excel" data-icon="fileSpreadsheet"><span>Export Excel</span></button>
          </div>
        </div>

        <div id="report-content"></div>
      </div>
    </main>
  </div>

  <script src="../../node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/reports.js"></script>
</body>
</html>
